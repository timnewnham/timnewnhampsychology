<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coming Soon — Tim Newnham Psychology</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Crimson+Pro:ital,wght@0,300;0,400;1,300;1,400&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --gold: #C9A84C;
            --gold-light: #E8C97A;
            --dark: #0A0A0A;
            --text: #F0EAD6;
            --text-muted: #8a8070;
        }

        html, body {
            width: 100%;
            height: 100%;
            background: var(--dark);
            color: var(--text);
            font-family: 'Crimson Pro', Georgia, serif;
            animation: bodyFade 1s ease both;
        }

        @keyframes bodyFade { from { opacity: 0; } to { opacity: 1; } }

        .wrap {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            padding: 2rem;
        }

        .nav-logo {
            font-family: 'Cinzel', serif;
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.2em;
            color: var(--gold);
            text-transform: uppercase;
            text-decoration: none;
            margin-bottom: 3rem;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: clamp(1.4rem, 3vw, 2.2rem);
            font-weight: 700;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--gold-light);
            margin-bottom: 1.2rem;
        }

        p {
            font-family: 'Crimson Pro', serif;
            font-size: clamp(1rem, 1.5vw, 1.15rem);
            font-weight: 300;
            font-style: italic;
            color: var(--text-muted);
            max-width: 480px;
            line-height: 1.8;
            margin-bottom: 2.5rem;
        }

        .home-link {
            font-family: 'Cinzel', serif;
            font-size: 0.7rem;
            letter-spacing: 0.2em;
            text-transform: uppercase;
            color: var(--dark);
            background: var(--gold);
            padding: 1rem 2.5rem;
            text-decoration: none;
            transition: background 0.3s ease, transform 0.2s ease;
        }

        .home-link:hover {
            background: var(--gold-light);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="wrap">
        <a href="index.html" class="nav-logo">Tim Newnham Psychology</a>
        <h1>Coming Soon</h1>
        <p>This path is still being prepared. Check back soon.</p>
        <a href="index.html" class="home-link">Return to Home</a>
    </div>

</body>
</html>
